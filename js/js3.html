<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Hover Image Change</title>
  <style>
    /* General Page Styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Styling for the content box */
    #content {
      width: 300px;
      height: 200px;
      border: 2px solid #333;
      text-align: center;
      line-height: 200px;
      font-size: 20px;
      cursor: pointer;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    /* Change background color on hover */
    #content:hover {
      background-color: #e0e0e0;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    /* Image container styling */
    #imageContainer {
      text-align: center;
      margin-top: 20px;
    }

    /* Styling for the image */
    #imageContainer img {
      width: 90%;    /* Increase width to 90% */
      height: 90%;   /* Increase height to 90% */
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    /* Image zoom effect on hover */
    #imageContainer img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div id="content">
    Hover over me!
  </div>
  
  <div id="imageContainer">
    <img id="defaultImage" src="img1.jpg" alt="Default Image">
  </div>

  <script>
    const content = document.getElementById('content');
    const defaultImage = document.getElementById('defaultImage');

    content.addEventListener('mouseover', function() {
      defaultImage.src = 'img2.jpg';
    });

    content.addEventListener('mouseout', function() {
      defaultImage.src = 'img1.jpg';
    });
  </script>

</body>
</html>
